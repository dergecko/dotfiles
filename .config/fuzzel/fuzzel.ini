# Gruvbox, matching waybar/style.css
# Colors are RRGGBBAA

[main]
font=DejaVu Sans Mono:size=11
prompt="❯ "
terminal=alacritty -e
layer=overlay
width=40
lines=12
horizontal-pad=16
vertical-pad=12
inner-pad=8

[colors]
# bar background (#282828e0)
background=282828e0
text=ebdbb2ff
prompt=8ec07cff
placeholder=928374ff
input=ebdbb2ff
match=fabd2fff
# same as the waybar clock (@black on @white)
selection=ebdbb2ff
selection-text=282828ff
selection-match=9d0006ff
counter=a89984ff
border=ebdbb2ff

[border]
width=2
# waybar uses square corners
radius=0
