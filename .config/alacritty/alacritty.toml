[window]
# Adds breathing room around the text
padding = { x = 10, y = 10 }
# Makes the terminal slightly transparent (0.0 is fully transparent, 1.0 is opaque)
opacity = 0.95
decorations = "None"

[font]
size = 11.0

# Replace this with your preferred programming font
[font.normal]
family = "DejaVu Sans Mono"
style = "Regular"

[font.bold]
family = "DejaVu Sans Mono"
style = "Bold"

#[colors.primary]
#background = "#1e1e2e"
#foreground = "#cdd6f4"
#
#[colors.normal]
#black   = "#45475a"
#red     = "#f38ba8"
#green   = "#a6e3a1"
#yellow  = "#f9e2af"
#blue    = "#89b4fa"
#magenta = "#f5c2e7"
#cyan    = "#94e2d5"
#white   = "#bac2de"

[font.italic]
family = "DejaVu Sans Mono"
style = "Oblique" 

[colors.primary]
background = "#282828"
foreground = "#ebdbb2"

[colors.normal]
black   = "#282828"
red     = "#cc241d"
green   = "#98971a"
yellow  = "#d79921"
blue    = "#458588"
magenta = "#b16286"
cyan    = "#689d6a"
white   = "#a89984"

[colors.bright]
black   = "#928374"
red     = "#fb4934"
green   = "#b8bb26"
yellow  = "#fabd2f"
blue    = "#83a598"
magenta = "#d3869b"
cyan    = "#8ec07c"
white   = "#ebdbb2"
